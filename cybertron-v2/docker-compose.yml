version: "3.8"
services:
  cybertron:
    build: .
    image: cybertron:v2
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    environment:
      - CYBERTRON_LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    command: tui
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
