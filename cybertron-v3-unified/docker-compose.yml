version: "3.8"

services:
  cybertron-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cybertron-api
    command: ["cybertron", "server", "--host", "0.0.0.0", "--port", "8443"]
    ports:
      - "8443:8443"
    volumes:
      - cybertron-data:/root/.cybertron
      - /var/log:/var/log:ro
    environment:
      - CT_SERVER_HOST=0.0.0.0
      - CT_SERVER_PORT=8443
      - CT_REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - cybertron-net

  cybertron-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cybertron-web
    command: ["cybertron", "web", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    volumes:
      - cybertron-data:/root/.cybertron
    environment:
      - CT_WEB_PORT=8080
      - CT_PASSKEY_ENABLED=true
    depends_on:
      - redis
      - cybertron-api
    networks:
      - cybertron-net

  redis:
    image: redis:7-alpine
    container_name: cybertron-redis
    volumes:
      - redis-data:/data
    networks:
      - cybertron-net

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cybertron-worker
    command: ["celery", "-A", "cybertron.core.engine", "worker", "--loglevel=info"]
    volumes:
      - cybertron-data:/root/.cybertron
    environment:
      - CT_REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - cybertron-net

volumes:
  cybertron-data:
  redis-data:

networks:
  cybertron-net:
    driver: bridge
