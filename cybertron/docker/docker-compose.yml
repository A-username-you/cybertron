version: "3.8"

services:
  # ─── Cybertron Gateway (Node.js runtime) ────────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: cybertron-gateway
    ports:
      - "8765:8765"
    environment:
      - NODE_ENV=production
      - CYBERTRON_PORT=8765
      - NIM_API_KEY=${NIM_API_KEY:-}
      - HACKERONE_API_KEY=${HACKERONE_API_KEY:-}
      - HACKERONE_USERNAME=${HACKERONE_USERNAME:-}
    volumes:
      - cybertron-data:/root/.cybertron
      - ./configs:/app/configs:ro
    networks:
      - cybertron-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Python UI Layer ────────────────────────────────────────────────────
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: cybertron-ui
    ports:
      - "8080:8080"
    environment:
      - CYBERTRON_HOST=gateway
      - CYBERTRON_PORT=8765
      - UI_MODE=web
    volumes:
      - cybertron-data:/root/.cybertron
      - ./reports:/app/reports
    networks:
      - cybertron-net
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  # ─── Security Tools Container ──────────────────────────────────────────
  tools:
    build:
      context: ./tools
      dockerfile: Dockerfile
    container_name: cybertron-tools
    privileged: true
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - CYBERTRON_HOST=gateway
      - CYBERTRON_PORT=8765
      - TOOLS_MODE=executor
    volumes:
      - cybertron-data:/root/.cybertron
      - ./wordlists:/app/wordlists:ro
      - ./reports:/app/reports
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cybertron-net
    depends_on:
      - gateway
    restart: unless-stopped

  # ─── Burp Suite Collaborator (optional) ─────────────────────────────────
  collaborator:
    image: portswigger/cloud-collaborator:latest
    container_name: cybertron-collaborator
    ports:
      - "9090:9090"
    environment:
      - COLLABORATOR_DOMAIN=${COLLABORATOR_DOMAIN:-}
    networks:
      - cybertron-net
    profiles:
      - advanced

  # ─── Redis for state management ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cybertron-redis
    volumes:
      - redis-data:/data
    networks:
      - cybertron-net
    restart: unless-stopped

  # ─── PostgreSQL for findings database ──────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: cybertron-postgres
    environment:
      - POSTGRES_USER=cybertron
      - POSTGRES_PASSWORD=${DB_PASSWORD:-cybertron_secret}
      - POSTGRES_DB=findings
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - cybertron-net
    restart: unless-stopped

volumes:
  cybertron-data:
  redis-data:
  postgres-data:

networks:
  cybertron-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
